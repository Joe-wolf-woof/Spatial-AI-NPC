<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial AI NPC</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #camera-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
            background: #000;
        }
        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
            width: 90%;
            max-width: 400px;
        }
        .speech-bubble {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .api-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
            width: 100%;
        }
        button:disabled {
            background: #4b5563;
        }
    </style>

    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
          }
        }
    </script>
</head>
<body>

    <video id="camera-preview" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <input type="password" id="api-key-input" class="api-input" placeholder="Gemini API Key を入力してください">
        <div id="speech-bubble" class="speech-bubble">準備完了！APIキーを入れてボタンを押してください。</div>
        <button id="action-btn">AIに空間を見てもらう</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const bubble = document.getElementById('speech-bubble');
        let videoElement = null;

        // --- 1. Three.js シーン初期化 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.0, 5.5);
        camera.lookAt(0, 0.5, 0); // 画面中央にアバターが来るように視点を調整

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const grid = new THREE.GridHelper(10, 10, 0x4f46e5, 0x444444);
        scene.add(grid);

        const npcGroup = new THREE.Group();
        scene.add(npcGroup);

        // Three.js公式の確実なロボットモデルURLに変更
        const loader = new GLTFLoader();
        const modelUrl = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/RobotExpressive/RobotExpressive.glb';

        loader.load(modelUrl, (gltf) => {
            const model = gltf.scene;
            model.scale.set(0.45, 0.45, 0.45);
            npcGroup.add(model);
            bubble.textContent = '3Dロボット読込完了！APIキーを入れてボタンを押してください。';
        }, undefined, (error) => {
            console.warn('GLTF load failed:', error);
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0x4f46e5 });
            const box = new THREE.Mesh(geometry, material);
            box.position.y = 0.5;
            npcGroup.add(box);
        });

        function animate() {
            requestAnimationFrame(animate);
            npcGroup.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 2. カメラ初期化処理 ---
        async function initCamera() {
            const preview = document.getElementById('camera-preview');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                preview.srcObject = stream;
                await preview.play();
                videoElement = preview;
                return true;
            } catch (error) {
                alert('カメラ起動エラー: ' + error.message);
                return false;
            }
        }

        // --- 3. ボタン押下時のキャプチャ＆Gemini 2.5 Flash 連携 ---
        const actionBtn = document.getElementById('action-btn');
        const apiKeyInput = document.getElementById('api-key-input');

        actionBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert('APIキーを入力してください');
                return;
            }

            if (!videoElement) {
                bubble.textContent = 'カメラを起動中...';
                const success = await initCamera();
                if (!success) return;
                // カメラ起動直後は映像フレームが安定するまで少し待つ
                await new Promise(r => setTimeout(r, 500));
            }

            actionBtn.disabled = true;
            bubble.textContent = '空間をスキャンしてAIが分析中...';

            try {
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = (videoElement.videoHeight / videoElement.videoWidth) * 640 || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

                // 現行の gemini-2.5-flash モデルを指定
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "このスマホカメラの映像に何が写っていますか？ユーザーの状況や環境を推測し、親しみやすいトーンで1文（50文字以内）で描写してください。また雰囲気（happy, thinking, neutral のいずれか）をJSON形式で返してください。例: {\"text\":\"...\",\"emotion\":\"happy\"}" },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }],
                        generationConfig: { response_mime_type: "application/json" }
                    })
                });

                if (!response.ok) {
                    const errDetail = await response.text();
                    throw new Error(`HTTP ${response.status} - ${errDetail}`);
                }

                const result = await response.json();
                const aiResult = JSON.parse(result.candidates[0].content.parts[0].text);

                bubble.textContent = aiResult.text;

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const ut = new SpeechSynthesisUtterance(aiResult.text);
                    ut.lang = 'ja-JP';
                    window.speechSynthesis.speak(ut);
                }

            } catch (err) {
                console.error(err);
                bubble.textContent = 'エラー: ' + err.message;
            } finally {
                actionBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
