<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial AI NPC - Phase 1 & 2 Integrated</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* カメラ映像のプレビュー（右上に小さく表示） */
        #camera-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
            background: #000;
        }
        /* UIオーバーレイ */
        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
            width: 90%;
            max-width: 400px;
        }
        .speech-bubble {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .api-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .api-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }
        button:active {
            transform: scale(0.97);
            background: #4338ca;
        }
        button:disabled {
            background: #4b5563;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>

    <!-- Import Map で Three.js を読み込み -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
</head>
<body>

    <!-- カメラプレビュー用映像要素 -->
    <video id="camera-preview" autoplay playsinline muted></video>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <input type="password" id="api-key-input" class="api-input" placeholder="Gemini API Key を入力してください">
        <div id="speech-bubble" class="speech-bubble">APIキーを入力し、ボタンを押すとカメラが起動します。</div>
        <button id="action-btn">AIに空間を見てもらう</button>
    </div>
