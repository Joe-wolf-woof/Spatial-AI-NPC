<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial AI NPC - Debug Mode</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #camera-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
            background: #000;
        }
        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
            width: 90%;
            max-width: 400px;
        }
        .speech-bubble {
            background: rgba(200, 0, 0, 0.8); /* エラーが分かりやすいよう赤みの背景に */
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .api-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .api-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
            width: 100%;
        }
    </style>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
</head>
<body>

    <video id="camera-preview" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <input type="password" id="api-key-input" class="api-input" placeholder="Gemini API Key を入力してください">
        <div id="speech-bubble" class="speech-bubble">システム起動中...エラーがあればここに表示されます</div>
        <button id="action-btn">AIに空間を見てもらう</button>
    </div>

    <script>
        // スマホ実機でJSエラーを画面に強制表示するトラップ
        window.onerror = function(msg, url, line) {
            const bubble = document.getElementById('speech-bubble');
            if (bubble) {
                bubble.textContent = `JS Error: ${msg} (Line ${line})`;
            }
            console.error(msg, url, line);
            return true;
        };
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const bubble = document.getElementById('speech-bubble');
        bubble.textContent = 'モジュール読み込み成功。初期化中...';

        let videoElement = null;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        let npcGroup = new THREE.Group();
        scene.add(npcGroup);

        const loader = new GLTFLoader();
        const modelUrl = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/RobotExpressive/glTF-Binary/RobotExpressive.glb';

        loader.load(modelUrl, (gltf) => {
            const model = gltf.scene;
            model.scale.set(0.5, 0.5, 0.5);
            model.position.y = -1;
            npcGroup.add(model);
            bubble.textContent = '準備完了。APIキーを入れてボタンを押してください。';
        }, undefined, (error) => {
            console.warn('GLTF load failed:', error);
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0x4f46e5 });
            npcGroup.add(new THREE.Mesh(geometry, material));
            bubble.textContent = 'モデル読込失敗(フォールバック表示)。ボタン使用可能。';
        });

        function animate() {
            requestAnimationFrame(animate);
            if (npcGroup) npcGroup.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        async function initCamera() {
            const preview = document.getElementById('camera-preview');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                preview.srcObject = stream;
                await preview.play();
                videoElement = preview;
                return true;
            } catch (error) {
                alert('カメラ起動エラー: ' + error.message);
                return false;
            }
        }

        const actionBtn = document.getElementById('action-btn');
        const apiKeyInput = document.getElementById('api-key-input');

        actionBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert('APIキーを入力してください');
                return;
            }

            if (!videoElement) {
                bubble.textContent = 'カメラ権限を確認中...';
                const success = await initCamera();
                if (!success) return;
            }

            actionBtn.disabled = true;
            bubble.textContent = 'AI分析中...';

            try {
                // キャプチャ処理
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = videoElement.videoHeight * (640 / videoElement.videoWidth);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

                // Gemini API リクエスト
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "この状況を1文で描写し、emotion(happy/thinking/neutral)をJSONで返して。例: {\"text\":\"...\",\"emotion\":\"happy\"}" }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }],
                        generationConfig: { response_mime_type: "application/json" }
                    })
                });

                if (!response.ok) throw new Error(`API Error: ${response.statusText}`);
                const result = await response.json();
                const aiResult = JSON.parse(result.candidates[0].content.parts[0].text);

                bubble.textContent = aiResult.text;
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const ut = new SpeechSynthesisUtterance(aiResult.text);
                    ut.lang = 'ja-JP';
                    window.speechSynthesis.speak(ut);
                }

            } catch (err) {
                bubble.textContent = 'エラー: ' + err.message;
            } finally {
                actionBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
